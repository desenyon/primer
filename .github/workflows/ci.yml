name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting and shell syntax
        run: |
          test -z "$(gofmt -l cmd internal scripts)"
          sh -n install.sh
          sh -n scripts/build-release.sh
      - name: Race tests
        run: go test -race ./...
      - name: Static checks
        run: go vet ./...
      - name: Build
        run: go build -o bin/primer ./cmd/primer

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate tag and build assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          sh scripts/build-release.sh
      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt dist/install.sh \
            --verify-tag --prerelease --latest=false --title "Primer $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
